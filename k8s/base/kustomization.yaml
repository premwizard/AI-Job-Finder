apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - frontend.yaml
  - backend.yaml
  - postgres.yaml
  - redis.yaml

configMapGenerator:
  - name: Crown Atlas-config
    literals:
      - NODE_ENV=production
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://ai_job_finder:postgres@postgres:5432/ai_job_finder
      - REDIS_URL=redis://:redis@redis:6379/0

secretGenerator:
  - name: Crown Atlas-secret
    literals:
      - POSTGRES_PASSWORD=postgres
      - REDIS_PASSWORD=redis
      - SECRET_KEY=change-this-in-production-vault
