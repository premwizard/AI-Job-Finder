replicaCount: 1

image:
  pullPolicy: IfNotPresent

backend:
  image: "Crown Atlas-backend:latest"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

frontend:
  image: "Crown Atlas-frontend:latest"
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

postgres:
  enabled: true
  image: "postgres:15-alpine"
  user: "ai_job_finder"
  db: "ai_job_finder"
  password: "strong_db_password_here"
  persistence:
    enabled: true
    size: 10Gi
  resources: {}

redis:
  enabled: true
  image: "redis:7-alpine"
  password: "strong_redis_password_here"
  persistence:
    enabled: true
    size: 5Gi
  resources: {}

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: Crown Atlas.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls: []
