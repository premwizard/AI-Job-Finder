apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-job-finder.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "ai-job-finder.name" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-job-finder.name" . }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-job-finder.name" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: {{ include "ai-job-finder.fullname" . }}-config
            - secretRef:
                name: {{ include "ai-job-finder.fullname" . }}-secret
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: chroma-data
              mountPath: /app/chroma_db
            - name: uploads-data
              mountPath: /app/uploads
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: {{ include "ai-job-finder.fullname" . }}-chroma-pvc
        - name: uploads-data
          persistentVolumeClaim:
            claimName: {{ include "ai-job-finder.fullname" . }}-uploads-pvc
