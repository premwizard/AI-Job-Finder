{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "Crown Atlas.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "Crown Atlas.name" . }}-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "Crown Atlas.name" . }}-redis
{{- end }}
