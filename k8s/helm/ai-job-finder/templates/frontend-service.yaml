apiVersion: v1
kind: Service
metadata:
  name: {{ include "Crown Atlas.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "Crown Atlas.name" . }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "Crown Atlas.name" . }}-frontend
