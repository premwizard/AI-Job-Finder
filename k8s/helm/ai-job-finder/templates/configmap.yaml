apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-job-finder.fullname" . }}-config
data:
  NODE_ENV: "production"
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "ai-job-finder.fullname" . }}-postgres:5432/{{ .Values.postgres.db }}"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@{{ include "ai-job-finder.fullname" . }}-redis:6379/0"
