{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-job-finder.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "ai-job-finder.name" . }}-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "ai-job-finder.name" . }}-postgres
{{- end }}
