apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "Crown Atlas.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "Crown Atlas.name" . }}-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "Crown Atlas.name" . }}-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "Crown Atlas.name" . }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
