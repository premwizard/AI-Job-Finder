apiVersion: apps/v1
kind: Deployment
metadata:
  name: aijobfinder-backend
  namespace: production
  labels:
    app: aijobfinder-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aijobfinder-backend
  template:
    metadata:
      labels:
        app: aijobfinder-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/aijobfinder/aijobfinder-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: backend-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/security/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/security/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
